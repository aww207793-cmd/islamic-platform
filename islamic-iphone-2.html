 دلائل على عظمته وحدانيته، حدد الآيات التي تتحدث عن ذلك ثم بين بعضاً من تلك الدلائل؟"], "a": "يَلْفِتُ اللهُ تَعَالَى أَنْظَارَ الْعُقَلاَءِ مِنَ النَّاسِ إلى الآيَاتِ الدَّالَّةِ عَلَى أُلُوهِيَّتِهِ ، وَمِنْ هذِهِ الآيَاتِ : خَلْقُ السَّمَاوَاتِ وَالأَرْضِ وَمَا فِيهِمَا مِنْ عَجَائِبَ ، وَارْتِفَاعُ السَّمَاءِ وَكَوَاكِبُهَا ، وَدَوَرَانُ فَلَكِهَا ، وَاتِّسَاعُهَا ، وَمَا فِي الأَرْضِ مِنْ بِحَارٍ وَجِبَالٍ وَأَنْهَارٍ وَعُمْرانٍ وَقِفَارٍ . واخْتِلاَفُ اللَّيْلِ وَالنَّهَارِ ، وَتَعَاقُبُهُمَا ، يَجِيءُ هذا وَيَذْهَبُ ، وَيَعْقُبُهُ الآخَرُ ، واخْتِلاَفُهُمَا طُولاً وَقِصَراً . وَتَسْخِيرُ الْبَحْرِ لِحمل السُّفنِ ( الفُلْكِ ) لِيَنْتَقِلَ بِهَا النَّاسُ مِنْ جَانِبٍ إلى آخَرَ ، وَإنْزَالُ اللهِ الْمَاءَ مِنَ السَّمَاءِ لِيُحْيِيَ بِهِ الأَرْضَ بَعْدَ يَبَسِهَا (مَوْتِهَا) فَتَزْدَهِرُ وَتَنْبُتُ بِالْخُضْرَةِ وَالزَّرْعِ وَالثِّمَارِ . وَمِنْ آيَاتِهِ بَثُّ الدَّوَابِّ في الأَرْضِ عَلَى اخْتِلاَفِ أَنْوَاعِهَا وَأَشْكَالِهَا وَأَلْوَانِهَا ، وَهُوَ يَعْلَمُ ذلِكَ الخَلْقَ كُلَّهُ وَيَرْزُقُهُ . وَمِنْهَا تَسْخِيرُ الرِّيَاحِ السَّائِرَةِ بَيْنَ السَّمَاءِ وَالأَرْضِ إلى مَشِيئَةِ اللهِ تَعَالَى وَإِرَادَتِهِ ، وَسَوْقُ الغُيُومِ إلى حَيْثُ يَشَاءُ الله.فَكلُّ هذِهِ الآيَاتِ فِيها عِبَرٌ وَدَلاَلاَتٌ لِلنَّاسِ العُقَلاَءِ عَلَى أُلُوهِيَّةِ اللهِ وَقُدْرَتِهِ وَوَحْدَانِيَّتِهِ.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "سورة البقرة", "b": ["يَلْفِتُ اللهُ تَعَالَى أَنْظَارَ الْعُقَلاَءِ مِنَ النَّاسِ إلى الآيَاتِ الدَّالَّةِ عَلَى أُلُوهِيَّتِهِ ، وَمِنْ هذِهِ الآيَاتِ : خَلْقُ السَّمَاوَاتِ وَالأَرْضِ وَمَا فِيهِمَا مِنْ عَجَائِبَ ، وَارْتِفَاعُ السَّمَاءِ وَكَوَاكِبُهَا ، وَدَوَرَانُ فَلَكِهَا ، وَاتِّسَاعُهَا ، وَمَا فِي الأَرْضِ مِنْ بِحَارٍ وَجِبَالٍ وَأَنْهَارٍ وَعُمْرانٍ وَقِفَارٍ .", "واخْتِلاَفُ اللَّيْلِ وَالنَّهَارِ ، وَتَعَاقُبُهُمَا ، يَجِيءُ هذا وَيَذْهَبُ ، وَيَعْقُبُهُ الآخَرُ ، واخْتِلاَفُهُمَا طُولاً وَقِصَراً .", "وَتَسْخِيرُ الْبَحْرِ لِحمل السُّفنِ ( الفُلْكِ ) لِيَنْتَقِلَ بِهَا النَّاسُ مِنْ جَانِبٍ إلى ي طريق يتم تحقيق التعاون والتكافل بين ابناء الامة؟ وإذا انحرفت الأمم وظلم بعضها بعضاً فما جزاؤها؟ اكتب الحديث الشريف الذي يحث على التعاون ويؤيد ذلك المعنى. (1/2001)", "alt": [], "a": "عن طريقِ الإنفاقِ والمساعدة، ورعايةِ مصالحِ المحتاجين والفقراء، بعيداً عن المِنّةِ وذلّ السؤال، إذ إن من صفات المسلمين التعاون والتعاطف فيما بينهم, قال تعالى:{ وَتَعَاوَنُوا۟ عَلَى ٱلْبِرِّ وَٱلتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا۟ عَلَى ٱلْإِثْمِ وَٱلْعُدْوَٰنِ }\nوإذا كانت هذه هي صفات الأفراد ، فما ينبغي أن يجحد الغنيّ حقّ الفقير في ماله، أو يَدَعَهُ للبؤسِ والفاقةِ والعوز. ابتلاهم الله بالتخلف والجوع ونقص من الأموال والأنفس والثمرات.\nقال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "التعاون بين المسلمين", "b": ["عن طريقِ الإنفاقِ والمساعدة، ورعايةِ مصالحِ المحتاجين والفقراء، بعيداً عن المِنّةِ وذلّ السؤال، إذ إن من صفات المسلمين التعاون والتعاطف فيما بينهم, قال تعالى:{ وَتَعَاوَنُوا۟ عَلَى ٱلْبِرِّ وَٱلتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا۟ عَلَى ٱلْإِثْمِ وَٱلْعُدْوَٰنِ }", "وإذا كانت هذه هي صفات الأفراد ، فما ينبغي أن يجحد الغنيّ حقّ الفقير في ماله، أو يَدَعَهُ للبؤسِ والفاقةِ والعوز.", "ابتلاهم الله بالتخلف والجوع ونقص من الأموال والأنفس والثمرات.", "قال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)"]}, "id": "g69", "k": 69}, {"ch": 4, "topic": "التعاون بين المسلمين", "q": "حث الاسلام على التعاون والتكافل وعن طريق الإنفاق والمساعدة ورعاية مصالح المحتاجين، وضح ذلك؟ مستدلاً بالحديث الشريف. (1/2007)", "alt": [], "a": "في الحديث حثٌّ على التعاونِ والتكافلِ عن طريقِ الإنفاقِ والمساعدة، ورعايةِ مصالحِ المحتاجين والفقراء، بعيداً عن المِنّةِ وذلّ السؤال، إذ إن من صفات المسلمين التعاون والتعاطف فيما بينهم.\nقال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "التعاون بين المسلمين", "b": ["في الحديث حثٌّ على التعاونِ والتكافلِ عن طريقِ الإنفاقِ والمساعدة، ورعايةِ مصالحِ المحتاجين والفقراء، بعيداً عن المِنّةِ وذلّ السؤال، إذ إن من صفات المسلمين التعاون والتعاطف فيما بينهم.", "قال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)"]}, "id": "g70", "k": 70}, {"ch": 4, "topic": "التعاون بين المسلمين", "q": "حث الحديث الشريف على التعاون ورعاية مصالح المحتاجين, اورده مضبوطا بالشكل ثم أجب عن أثنين مما يأتي:- ١- ما سبب شيوع الفقر بين ابناء الأمة؟ ٢- ما حكم من يتصف بالرياء؟ ٣- الاسلام يكره الفوارق بين ابناء الأمة. لماذا؟ (1/2010)", "alt": [], "a": "قال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)\n١- إنّ سبب شيوع الفقر بين أبناء الأمة هو منع المال عن تأدية وظيفته الاجتماعية من بعض الأغنياء وجعله دولة بينهم، وعدم مساعدتهم للفقراء.\n٢- حكم من يتصف بالرياء: البغض في الدنيا والعذاب يوم القيامة, قال رسول الله (ﷺ):( ثلاثة لا يكلمهم الله عز وجل يوم القيامة ولا ينظر اليهم ولا يزكيهم ولهم عذاب أليم: المنان بما اعطى والمسبل ازاره والمنفق سلعته بالحلف الكاذب).\n٣- لما وراءها من أحقاد وأضغان، وما يتبعها من أستئثار، وجشع وقسوة ، تُفسد النفوس.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "التعاون بين المسلمين", "b": ["قال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)", "١- إنّ سبب شيوع الفقر بين أبناء الأمة هو منع المال عن تأدية وظيفته الاجتماعية من بعض الأغنياء وجعله دولة بينهم، وعدم مساعدتهم للفقراء.", "٢- حكم من يتصف بالرياء: البغض في الدنيا والعذاب يوم القيامة, قال رسول الله (ﷺ):( ثلاثة لا يكلمهم الله عز وجل يوم القيامة ولا ينظر اليهم ولا يزكيهم ولهم عذاب أليم: المنان بما اعطى والمسبل ازاره والمنفق سلعته بالحلف الكاذب).", "٣- لما وراءها من أحقاد وأضغان، وما يتبعها من أستئثار، وجشع وقسوة ، تُفسد النفوس."]}, "id": "g71", "k": 71}, {"ch": 4, "topic": "التعاون بين المسلمين", "q": "قال رسول الله (ﷺ) (( من كان معه فضل ظهر...............)) ١- اكمل الحديث الشريف. ٢- ما معنى فليعد. ٣- علام يحث الحديث الشريف؟ ٤- بماذا بشر الاسلام من يجود بماله بنفس راضية؟ ٥- ما سبب شيوع الفقر وظهور الفوارق الطبقية بين ابناء الأمة؟ (1/2011)", "alt": [], "a": "١- قال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)\n٢- فليعد : من “العائدة ” وهي النفع والعطف والمعروف, يُعاد به على الإنسان المحتاج.\n٣- في الحديث حثٌّ على التعاونِ والتكافلِ عن طريقِ الإنفاقِ والمساعدة، ورعايةِ مصالحِ المحتاجين والفقراء، بعيداً عن المِنّةِ وذلّ السؤال، إذ إن من صفات المسلمين التعاون والتعاطف فيما بينهم.\n٤- يبشره بالجنة ونعيمها الدائم. قال تعالى:{ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ ثُمَّ لَا يُتْبِعُونَ مَآ أَنفَقُوا۟ مَنًّا وَلَآ أَذًى ۙ لَّهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ } وقال رسول (ﷺ): (( ايما مسلم كسا مسلماً ثوباً على عري كساه الله من خضر الجنة وايما مسلم أطعم مسلما على جوع أطعمه الله من ثمار الجنة وإيما مسلم سقى مسلماً على ظمأ سقاه الله عز وجل من الرحيق المختوم)).\n٥- إنّ سبب شيوع الفقر بين أبناء الأمة هو منع المال عن تأدية وظيفته الاجتماعية من بعض الأغنياء وجعله دولة بينهم، وعدم مساعدتهم للفقراء.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "التعاون بين المسلمين", "b": ["١- قال رسول الله (ﷺ) “من كان معه فضل ظهر فليعد به على من لا ظهر له ومن كان له فضل زاد فليعد به على من لا زاد له.” صدق رسول الله (ﷺ)", "٢- فليعد : من “العائدة ” وهي النفع والعطف والمعروف, يُعاد به على الإنسان المحتاج.", "٣- في الحديث حثٌّ على التعاونِ والتكافلِ عن طريقِ الإنفاقِ والمساعدة، ورعايةِ مصالحِ المحتاجين والفقراء، بعيداً عن المِنّةِ وذلّ السؤال، إذ إن من صفات المسلمين التعاون والتعاطف فيما بينهم.", "٤- يبشره بالجنة ونعيمها الدائم.", "قال تعالى:{ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ ثُمَّ لَا يُتْبِعُونَ مَآ أَنفَقُوا۟ مَنًّا وَلَآ أَذًى ۙ لَّهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا /2025 “الفرع العلمي”)"], "a": "هي ان تبقى صلة القربى بعيدة عن المنازعات التي تعترض حياة الزوجين فتفسد العلاقة النسبية، وليبقى المرء على اتصال دائم بقربياته المحرّم الزواج بهن كأخواته وعماته وخالاته، وألا يبتعد الإنسان عن جميع أهله فالواجب عليه أن يكون براً وقريباً إليهم.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "نظام الأسرة في الإسلام", "b": ["هي ان تبقى صلة القربى بعيدة عن المنازعات التي تعترض حياة الزوجين فتفسد العلاقة النسبية، وليبقى المرء على اتصال دائم بقربياته المحرّم الزواج بهن كأخواته وعماته وخالاته، وألا يبتعد الإنسان عن جميع أهله فالواجب عليه أن يكون براً وقريباً إليهم."]}, "id": "g89", "k": 89}, {"ch": 5, "topic": "نظام الأسرة في الإسلام", "q": "٢- الخطبة: من المبادىء العامة للزواج (الخطبة) وضح ذلك. (أو)", "alt": ["لم جعل الشارع المقدس الخطبة مقدمة للزواج؟ (أو) سؤال وزاري (2/2016)", "نظرا لاهمية عقد الزواج فقد جعل الشارع مقدمة له وهي (الخطبة) ووضع احكاما مفصله لها , ماهي؟"], "a": "نظرا لاهمية عقد الزواج ولما يترتب عليه من اثار ونتائج فقد جعل الشارع له مقدمة هي الخطبة ووضع لها أحكام مفصلة، فحثّ الشارع الخاطب على أن يرى خطيبته وأن تراه أيضاً ليعرف كلّ منهما الآخر ضمن حدود الشرع.\nعن جابر (رضي الله عنه) قال: قال رسول الله(ﷺ) : (إذا خطب أحدكم المرأة فإن استطاع أن ينظر منها ما يدعو إلى إنكاحها فليفعل ) وقال أيضا لأحد صحابته وقد خطب امرأة ( انظر إليها فانه أحرى ان يؤدم بينكما)\nفاباح الإسلام ان يجتمع الراغب في الخطبة مع من يريد خطبتها يحدثها ويحدثه عن آماله وأهدافه ومنهجه في الحياة المشتركة المقبلة وان يكرر هذه الزيارة ان لم يحصل المقصود بزيارة واحدة على ان يكون هذا ضمن حدود الشريعة فلا ينظر منها الى ما لم يجزه الشرع للخاطب. و لا يختلي بها لانه لا فائدة من انفرادهما بل ربما يقع الضرر الواضح والمؤكد. لهذا يجب ان يكون لقاؤهما مع محرم لئلا تحدث نفس أحدهما بشيء تأباه الشريعة والخلق الكريم. وهذا من حرص الاسلام على انشاء أسرة نظيفة في مجتمع شريف.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "نظام الأسرة في الإسلام", "b": ["نظرا لاهمية عقد الزواج ولما يترتب عليه من اثار ونتائج فقد جعل الشارع له مقدمة 5, "topic": "نظام الأسرة في الإسلام", "q": "٤- المهر: من المبادىء العامة للزواج (المهر) وضح ذلك. (أو)", "alt": ["شريعة الاسلام قدست المرأة تقديساً لا مثيل له. فهل جعل الاسلام المهر ثمنا للمرأة؟ ولماذا؟ ولم لم يجعل المهر على عاتقها؟ وما الدليل عليه؟ (أو)", "رفع الإسلام منزلة المرأة ولم يجعل المهر ثمنا لها، وضح ذلك؟"], "a": "رفع الإسلام منزلة المرأة ولم يجعل المهر ثمنا لها، لأنّ الزوجة إنسان والإنسان أكرمه الله وسخّر له الكون كله، فقيمته لاتقدر بثمن، بل جعل القرآن المهر هدية لازمة يقدمها الزوج لزوجته رمز تقدير وإكرام، قال تعالى:{ وَءَاتُوا۟ ٱلنِّسَآءَ صَدُقَـٰتِهِنَّ نِحْلَةً ۚ } وقال النبي محمد(ﷺ): (التمس ولو خاتماً من حديد)، تسهيلا لأمر الزواج الذي هو اللبنة الأولى في بناء هذا المجتمع، ولئلا يكون المهر عقبة في طريق الشباب يصدّهم عن الزواج، فينتج عن ذلك أضرار اجتماعية تصيب الأمة فتهدّ كيانها القويم.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "نظام الأسرة في الإسلام", "b": ["رفع الإسلام منزلة المرأة ولم يجعل المهر ثمنا لها، لأنّ الزوجة إنسان والإنسان أكرمه الله وسخّر له الكون كله، فقيمته لاتقدر بثمن، بل جعل القرآن المهر هدية لازمة يقدمها الزوج لزوجته رمز تقدير وإكرام، قال تعالى:{ وَءَاتُوا۟ ٱلنِّسَآءَ صَدُقَـٰتِهِنَّ نِحْلَةً ۚ } وقال النبي محمد(ﷺ): (التمس ولو خاتماً من حديد)، تسهيلا لأمر الزواج الذي هو اللبنة الأولى في بناء هذا المجتمع، ولئلا يكون المهر عقبة في طريق الشباب يصدّهم عن الزواج، فينتج عن ذلك أضرار اجتماعية تصيب الأمة فتهدّ كيانها القويم."]}, "id": "g94", "k": 94}, {"ch": 5, "topic": "نظام الأسرة في الإسلام", "q": "٥- القوامة: القوامة تكليف لاتشريف، ناقش ذلك. (سؤال المناقشة)", "alt": [], "a": "يشترك الزوجان في تدبير شؤون الأسرة فيتبادلان الرأي فيما يجب عمله من دون طغيان لشخصية أحدهما على الآخر ضمن حدود التشاور والتناصح، فاذا استقر رأيهما على أمر أخذا به. ولكن حياة طويلة كالحياة الزوجية لاتخلو من خلاف في الرأي حول موضوع معين فلا بدّ من وجود شخص يعدّ مسؤولاً وإلاّ سادت الفوضى وفسدت الأسرة.وقد حمّل القرآن الكريم الرجل مسؤولية أكبر في انتظام حياة الأسرة . قال تعالى:{ ٱلرِّجَالُ قَوَّٰمُونَ عَلَى ٱلنِّسَآءِ بِمَا فَضَّلَ ٱللَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٍ وَبِمَآ أَنفَقُوا۟ مِنْ أَمْوَٰلِهِمْ ۚ }\nوقوامة الرجل هذه ليست أفضلية جنسية، بل هي مسؤولية تحقق انتظام الأسرة لقول الرسول الكريم (ﷺ) :( كلكم راع وكلكم مسؤول عن رعيته) لكنّ العبء الأكبر من هذه المسؤولية يقع على عاتق الرجل، فالزوج هو الذي يدفع المهر وينُفق على زوجته واولاده ويقوم على تأمين السكن والمستلزمات الاخرى في حياتهم.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "نظام الأسرة في الإسلام", "b": ["يشترك الزوجان في تدبير شؤون الأسرة فيتبادلان الرأي فيما يجب عمله من دون طغيان لشخصية أحدهما على الآخر ضمن حدود التشاور والتناصح، فاذا استقر رأيهما على أمر أخذا به.", "ولكن حياة طويلة كالحياة الزوجية لاتخلو من خلاف في الرأي حول موضوع معين فلا بدّ من وجود شخص يعدّ مسؤولاً وإلاّ سادت الفوضى وفسدت الأسرة.وقد حمّل القرآن الكريم الرجل مسؤولية أكبر في انتظام حياة الأسرة .", "قال تعالى:{ ٱلرِّجَالُ قَوَّٰمُونَ عَلَى ٱلنِّسَآءِ بِمَا فَضَّلَ ٱللَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٍ وَبِمَآ أَنفَقُوا۟ مِنْ أَمْوَٰلِهِمْ ۚ }", "وقوامة الرجل هذه ليست أفضلية جنسية، بل هي مسؤولية تحقق انتظام الأسرة لقول الرسول الكريم (ﷺ) :( كلكم راع وكلكم مسؤول عن رعيته) لكنّ العبء الأكبر من هذه المسؤولية يقع على عاتق الرجل، فالزوج هو الذي يدفع المهر وينُفق على زوجته واولاده ويقوم على تأمين السكن والمستلزمات الاخرى في حياتهم."]}, "id": "g95", "k": 95}, {"ch": 5, "topic": "نظام الأسرة في الإسلام", "q": "٦- حسن المعاملة: من المبادىء العامة للزواج (حسن المعاملة) وضح ذلك.", "alt": [], "a": "أوجب الإسلام حسن المعاملة بين افراد المجتمع عامة وبين افراد الأسرة خاصة، وبين الزوجين على نحو مؤكد بنصوص من القرآن الكريم وأحاديث الرسول(ﷺ). قال تعالى مخاطباً الأزواج:{ وَعَاشِرُوهُنَّ بِٱلْمَعْرُوفِ ۚ فَإِن كَرِهْتُمُوهُنَّ فَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًٔا وَيَجْعَلَ ٱللَّهُ فِيهِ خَيْرًا كَثِيرًا } وقال (ﷺ):(خيركم خيركم لأهله).\nفالأسرة المسلمة ينبغي أن لا تتسم بالاستبداد في الرأي ولا الظلم في المعاملة ولا الطاعة العمياء، بل هناك حقوق وواجبات، إذ لا طاعة لمخلوق في معصية الخالق بل الطاعة لله، فطاعة الزوجة لزوجها ليست لشخصه بل للأوامر والقواعد والنظم التي بموجبها تم عقد الزواج، وحسن معاملة الزوج لزوجته ليست من قبيل المنّ أو العطف بل من قبيل القيام بالواجب.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "نظام الأسرة في الإسلام", "b": ["أوجب الإسلام حسن المعاملة بين افراد المجتمع عامة وبين افراد الأسرة خاصة، وبين الزوجين على نحو مؤكد بنصوص من القرآن الكريم وأحاديث الرسول(ﷺ).", "قال تعالى مخاطباً الأزواج:{ وَعَاشِرُوهُنَّ بِٱلْمَعْرُوفِ ۚ فَإِن كَرِهْتُمُوهُنَّ فَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًٔا وَيَجْعَلَ ٱللَّهُ فِيهِ خَيْرًا كَثِيرًا } وقال (ﷺ):(خيركم خيركم لأهله).", "فالأسرة المسلمة ينبغي أن لا تتسم بالاستبداد في الرأي ولا الظلم في المعاملة ولا الطاعة العمياء، بل هناك حقوق وواجبات، إذ لا طاعة لمخلوق في معصية الخالق بل الطاعة لله، فطاعة الزوجة لزوجها ليست لشخصه بل للأوامر والقواعد والنظم التي بموجبها تم عقد الزواج، وحسن معاملة الزوج لزوجته ليست من قبيل المنّ أو العطف بل من قبيل القيام بالواجب."]}, "id": "g96", "k": 96}, {"ch": 6, "topic": "النهي عن الغضب", "q": "ما الغضب؟ وما الأمور التي تنشئ الغضب؟ سؤال (2016/تمهيدي)", "alt": ["عرف (الغضب)؟ وما بواعثه؟ (1/2023 “اسئلة الفرع التطبيقي”)", "عرف (الغضب)؟ وما منشأه؟ (1/2025 “اسئلة الفرع العلمي”)"], "a": "الغضب :حالة نفسية ، تبعث على هياج الإنسان، وثورته قولاً أو عملاً .وهو مفتاح الشرور ورأس الآثام ومفتاح الأزمات والاخطار .\nقد يكون منشأ الغضب غالباً أحد الأمور الآتية:\n(١ ) إنحرافاً صحياً، كاعتلال الصحة العامة, أو ضعف الجهاز العصبي، مما يسبب سرعة التهيج.\n(٢ ) نفسياً، منبعثاً عن الاجهاد العقلي, أو الأنانية, أو الشعور بالإهانة, والاستنقاص, ونحوها من الحالات النفسية، التي سرعان ما تستفزّ الإنسان، وتستثير غضبه.\n(٣ ) أخلاقي، كتعود الشراسة, وسرعة التهيج، مما يوجب رسوخ عادة الغضب في صاحبه.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "النهي عن الغضب", "b": ["الغضب :حالة نفسية ، تبعث على هياج الإنسان، وثورته قولاً أو عملاً .وهو مفتاح الشرور ورأس الآثام ومفتاح الأزمات والاخطار .", "قد يكون منشأ الغضب غالباً أحد الأمور الآتية:", "(١ ) إنحرافاً صحياً، كاعتلال الصحة العامة, أو ضعف الجهاز العصبي، مما يسبب سرعة التهيج.", "(٢ ) نفسياً، منبعثاً عن الاجهاد العقلي, أو الأنانية, أو الشعور بالإهانة, والاستنقاص, ونحوها من الحالات النفسية، التي سرعان ما تستفزّ الإنسان، وتستثير غضبه.", "(٣ ) أخلاقي، كتعود الشراسة, وسرعة التهيج، مما يوجب رسوخ عادة الغضب في صاحبه."]}, "id": "g97", "k": 97}, {"ch": 6, "topic": "النهي عن الغضب", "q": "ما بواعث الغضب ؟ (2/2022) (2022/تمهيدي “اسئلة الفرع المهني”) (أو)", "alt": ["ما منشأ (أسباب) الغضب؟ (3/2023) (3/2024) (2/2024 “نظام المحاولات”) (أو)", "ما الأمور التي تنشئ الغضب؟ (أو)", "عدد مع الشرح الأمور التي ينشأ منها الغضب؟ (1/2022 “اسئلة الفرع التطبيقي”) (1/2024 اسئلة الفرع المهني)"], "a": "قد يكون منشأ الغضب غالباً أحد الأمور الآتية:\n(١ ) إنحرافاً صحياً، كاعتلال الصحة العامة, أو ضعف الجهاز العصبي، مما يسبب سرعة التهيج.\n(٢ ) نفسياً، منبعثاً عن الاجهاد العقلي, أو الأنانية, أو الشعور بالإهانة, والاستنقاص, ونحوها من الحالات النفسية، التي سرعان ما تستفزّ الإنسان، وتستثير غضبه.\n(٣ ) أخلاقي، كتعود الشراسة, وسرعة التهيج، مما يوجب رسوخ عادة الغضب في صاحبه.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "النهي عن الغضب", "b": ["قد يكون منشأ الغضب غالباً أحد الأمور الآتية:", "(١ ) إنحرافاً صحياً، كاعتلال الصحة العامة, أو ضعف الجهاز العصبي، مما يسبب سرعة التهيج.", "(٢ ) نفسياً، منبعثاً عن الاجهاد العقلي, أو الأنانية, أو الشعور بالإهانة, والاستنقاص, ونحوها من الحالات النفسية، التي سرعان ما تستفزّ الإنسان، وتستثير غضبه.", "(٣ ) أخلاقي، كتعود الشراسة, وسرعة التهيج، مما يوجب رسوخ عادة الغضب في صاحبه."]}, "id": "g98", "k": 98}, {"ch": 6, "topic": "النهي عن الغضب", "q": "ما أضرار الغضب؟ (سؤال المناقشة) (أو)", "alt": ["ما هي الاضرار التي تنتج عن الغضب المذموم؟ (أو)", "ما هي عواقب (أضرار) الغضب المذموم؟"], "a": "للغضب أضرار جسيمة، و فادحة، تضرّ بالإنسان فرداً ومجتمعاً، جسمياً ونفسياً، مادياً وأدبياً .فكم غضبة جرحت العواطف، وشحنت النفوس بالأضغان، وفكّكت أواصر التحاب والتآلف بين الناس .وكم غضبة زجّت أناساً في السجون، وعرضتهم للمهالك، وكم غضبة أثارت الحروب وسفكت الدماء فراح ضحيتها الآلاف من الأبرياء فضلاً عما ينجم عنه من المآسي والأزمات النفسية، التي قد تؤدي إلى موت الفجأة.والغضب بعد هذا يحيل الإنسان بركاناً ثائراً، يتفجر غيظاً وشرّاً، فإذا هو وحش في صورة إنسان .فينطلق لسانه بالفحش والبذاء ،وهتك الأعراض،وإذا بيديه تنبعثان بالضرب والتنكيل،وربما أفضى الغضب إلى القتل وقد تنعكس آثار الغضب على صاحبه، فينبعث في تمزيق ثوبه ، ولطم رأسه ، وربما قام بأعمال جنونية . فهذا الغضب هو الغضب المذموم.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "النهي عن الغضب", "b": ["للغضب أضرار جسيمة، و فادحة، تضرّ بالإنسان فرداً ومجتمعاً، جسمياً ونفسياً، مادياً وأدبياً .فكم غضبة جرحت العواطف، وشحنت النفوس بالأضغان، وفكّكت أواصر التحاب والتآلف بين الناس .وكم غضبة زجّت أناساً في السجون، وعرضتهم للمهالك، وكم غضبة أثارت الحروب وسفكت الدماء فراح ضحيتها الآلاف من الأبرياء فضلاً عما ينجم عنه من المآسي والأزمات النفسية، التي قد تؤدي إلى موت الفجأة.والغضب بعد هذا يحيل الإنسان بركاناً ثائراً، يتفجر غيظاً وشرّاً، فإذا هو وحش في صورة إنسان .فينطلق لسانه بالفحش والبذاء ،وهتك الأعراض،وإذا بيديه تنبعثان بالضرب والتنكيل،وربما أفضى الغضب إلى القتل وقد تنعكس آثار الغضب على صاحبه، فينبعث في تمزيق ثوبه ، ولطم رأسه ، وربما قام بأعمال جنونية .", "فهذا الغضب هو الغضب المذموم."]}, "id": "g99", "k": 99}, {"ch": 6, "topic": "النهي عن الغضب", "q": "ما علاج الغضب ؟ (سؤال المناقشة) (أو)", "alt": ["كيف يتم علاج الغضب؟"], "a": "(١) إذا كان منشأ الغضب اعتلالاً صحياً، أو هبوطاً عصبياً مثلما هو في المرضى والشيوخ ونحاف البنية، فعلاجهم - والحالة هذه - بالوسائل الطبية، وتقوية صحتهم العامة، وتوفير دواعي الراحة النفسية والجسمية لهم، كتنظيم الغذاء، والتزام النظافة، وممارسة الرياضة الملائمة، واستنشاق الهواء الطلق، وتعاطي الاسترخاء العضلي بالتمدّد على الفراش. كل ذلك مع اجتناب مرهقات النفس والجسم، كالإجهاد الفكري، والسهر المضني، والاستسلام للكآبة، ونحو ذلك من دواعي التهييج.\n(٢) للغضب أسباب تستثيره، أهمها :المغالاة في الأنانية، والجدل والمراء، والاستهزاء والتعيير، والمزاح الجارح .وعلاجه في هذه الحالات باجتناب أسبابه، والابتعاد قدر المستطاع عن مثيراته فعندما تحسن التعامل مع الآخرين تبتعد عن الغضب.\n(٣) تذكّر مساوئ الغضب وأخطاره وآثامه، وأنها تضرّ بالغاضب أولا، وتضرّ به أكثر من المغضوب عليه، فربّ أمر تافه آثار غضبة عارمة، أودت بصحة الانسان وسعادته. يقول بعض باحثي علم النفس :دع محاولة الاقتصاص من أعدائك، فإنك بمحاولتك هذه تؤذي نفسك أكثر مما تؤذيهم ...إنه حين نمقت أعداءنا نتيح لهم قوة علينا، وإنّ أعداءنا ليرقصون طرباً لو علموا كم يسببون لنا من القلق وكم يقتصون منا، ويحيل أيامنا وليالينا الى جحيم. وهكذا يجدر تذكّر فضائل الحلم، وآثاره الجليلة، وأنه باعث على إعجاب الناس وثنائهم، وكسب عواطفهم. وخير محفّز على الحلم قول الله عز وجل:{ ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ فَإِذَا ٱلَّذِى بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٌ كَأَنَّهُۥ وَلِىٌّ حَمِيمٌ ﴿٣٤﴾ وَمَا يُلَقَّىٰهَآ إِلَّا ٱلَّذِينَ صَبَرُوا۟ وَمَا يُلَقَّىٰهَآ إِلَّا ذُو حَظٍّ عَظِيمٍ ﴿٣٥﴾ }\n(٤ ) تذكر إنّ سطوة الغاضب، تعرّض الغاضب لسخط الله تعالى وعقابه، وربما عرّضته لسطوة من أغضبه واقتصاصه منه في نفسه أو في ماله أو في عزيز عليه.\n(٥ ) تذكّر أنّ من الخير للغاضب ضبط النفس، والسيطرة على الأعصاب والتروّي في أقواله وأفعاله عند احتدام الغضب، فذلك مما يخفّف حدّة التوتر والتهيج، ويعيده إلى الرشد والصواب، ولا يُنال ذلك إلاّ بالتصبر والتعوّد قال أمير المؤمنين (عليه السلام): “إن لم تكن حليماً فتحلّم، فإنه قلّ من تشبّه بقوم أوشك أن يكون منهم”.\n(٦ ) ومن علاج الغضب التوجه الى الله والاستعاذة به من الشيطان الرجيم قال تعالى:{ وَإِمَّا يَنزَغَنَّكَ مِنَ ٱلشَّيْطَـٰنِ نَزْغٌ فَٱسْتَعِذْ بِٱللَّهِ ۚ إِنَّهُۥ سَمِيعٌ عَلِيمٌ }\n(٧) الوضوء قال (ﷺ):(إنّ الغضب من الشيطان، وإن الشيطان خُلق من النار ، وإنما تطفأ النار بالماء ، فإذا غضب أحدكم فليتوضأ. )\n(٨ ) تغيير الحالة التي كان عليها الغضبان : أن النبي (ﷺ) قال: إذا غضب أحدكم وهو قائم فليجلس، فإن ذهب عنه الغضب و إلاّ فليضطجع.\n(٩) استحضار ما ورد في ثواب كظم الغيظ . قال تعالى:{ وَٱلْكَـٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ }\n(١٠) تذكر أن ترك الغضب من أسباب دخول الجنة جاء في رواية عن رسول الله (ﷺ) : (لا تغضب ولك الجنة)\n(١١) السكوت ورد أن النبي (ﷺ) قال : إذا غضب أحدكم فليسكت.\n(١٢) أن يُروِّض الإنسان نفسه على الحلم والأناة وكظم الغيظ فإنه من يتحرّى الخير يعطهُ ومن يتق الشر يُوقَّه. لذا يجب تجنبُ الغضب؛ لأنّ الغضب جمرة تتقد في القلب، وتدعو إلى السطوة والانتقام والتشفّي.فإذا ما ضبط الإنسان نفسه عند الغضب، وكبح جماحها عند اشتداد ثورتها، فإنه يحفظ لنفسه عزتها وكرامتها، وينأى بها عن ذُلّ الاعتذار، ومغبّة الندم، ومذمّة الانتقام.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "النهي عن الغضب", "b": ["(١) إذا كان منشأ الغضب اعتلالاً صحياً، أو هبوطاً عصبياً مثلما هو في المرضى والشيوخ ونحاف البنية، فعلاجهم - والحالة هذه - بالوسائل الطبية، وتقوية صحتهم العامة، وتوفير دواعي الراحة النفسية والجسمية لهم، كتنظيم الغذاء، والتزام النظافة، وممارسة الرياضة الملائمة، واستنشاق الهواء الطلق، وتعاطي الاسترخاء العضلي بالتمدّد على الفراش.", "كل ذلك مع اجتناب مرهقات النفس والجسم، كالإجهاد الفكري، والسهر المضني، والاستسلام للكآبة، ونحو ذلك من دواعي التهييج.", "(٢) للغضب أسباب تستثيره، أهمها :المغالاة في الأنانية، والجدل والمراء، والاستهزاء والتعيير، والمزاح الجارح .وعلاجه في هذه الحالات باجتناب أسبابه، والابتعاد قدر المستطاع عن مثيراته فعندما تحسن التعامل مع الآخرين تبتعد عن الغضب.", "(٣) تذكّر مساوئ الغضب وأخطاره وآثامه، وأنها تضرّ بالغاضب أولا، وتضرّ به أكثر من المغضوب عليه، فربّ أمر تافه آثار غضبة عارمة، أودت بصحة الانسان وسعادته.", "يقول بعض باحثي علم النفس :دع محاولة الاقتصاص من أعدائك، فإنك بمحاولتك هذه تؤذي نفسك أكثر مما تؤذيهم ...إنه حين نمقت أعداءنا نتيح لهم قوة علينا، وإنّ أعداءنا ليرقصون طرباً لو علموا كم يسببون لنا من القلق وكم يقتصون منا، ويحيل أيامنا وليالينا الى جحيم.", "وهكذا يجدر تذكّر فضائل الحلم، وآثاره الجليلة، وأنه باعث على إعجاب الناس وثنائهم، وكسب عواطفهم.", "وخير محفّز على الحلم قول الله عز وجل:{ ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ فَإِذَا ٱلَّذِى بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٌ كَأَنَّهُۥ وَلِىٌّ حَمِيمٌ ﴿٣٤﴾ وَمَا يُلَقَّىٰهَآ إِلَّا ٱلَّذِينَ صَبَرُوا۟ وَمَا يُلَقَّىٰهَآ إِلَّا ذُو حَظٍّ عَظِيمٍ ﴿٣٥﴾ }", "(٤ ) تذكر إنّ سطوة الغاضب، تعرّض الغاضب لسخط الله تعالى وعقابه، وربما عرّضته لسطوة من أغضبه واقتصاصه منه في نفسه أو في ماله أو في عزيز عليه.", "(٥ ) تذكّر أنّ من الخير للغاضب ضبط النفس، والسيطرة على الأعصاب والتروّي في أقواله وأفعاله عند احتدام ال َنَّهُۥ وَلِىٌّ حَمِيمٌ ﴿٣٤﴾ وَمَا يُلَقَّىٰهَآ إِلَّا ٱلَّذِينَ صَبَرُوا۟ وَمَا يُلَقَّىٰهَآ إِلَّا ذُو حَظٍّ عَظِيمٍ ﴿٣٥﴾ }", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "النهي عن الغضب", "b": ["تذكّر مساوئ الغضب وأخطاره وآثامه، وأنها تضرّ بالغاضب أولا، وتضرّ به أكثر من المغضوب عليه، فربّ أمر تافه آثار غضبة عارمة، أودت بصحة الانسان وسعادته.", "يقول بعض باحثي علم النفس :دع محاولة الاقتصاص من أعدائك، فإنك بمحاولتك هذه تؤذي نفسك أكثر مما تؤذيهم ...إنه حين نمقت أعداءنا نتيح لهم قوة علينا، وإنّ أعداءنا ليرقصون طرباً لو علموا كم يسببون لنا من القلق وكم يقتصون منا، ويحيل أيامنا وليالينا الى جحيم.", "وهكذا يجدر تذكّر فضائل الحلم، وآثاره الجليلة، وأنه باعث على إعجاب الناس وثنائهم، وكسب عواطفهم.", "وخير محفّز على الحلم قول الله عز وجل:{ ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ فَإِذَا ٱلَّذِى بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٌ كَأَنَّهُۥ وَلِىٌّ حَمِيمٌ ﴿٣٤﴾ وَمَا يُلَقَّىٰهَآ إِلَّا ٱلَّذِينَ صَبَرُوا۟ وَمَا يُلَقَّىٰهَآ إِلَّا ذُو حَظٍّ عَظِيمٍ ﴿٣٥﴾ }"]}, "id": "g103", "k": 103}, {"ch": 6, "topic": "النهي عن الغضب", "q": "ما الذي تعرضه سطوة الغضب على الغاضب؟", "alt": [], "a": "تذكر إنّ سطوة الغاضب، تعرّض الغاضب لسخط الله تعالى وعقابه، وربما عرّضته لسطوة من أغضبه واقتصاصه منه في نفسه أو في ماله أو في عزيز عليه.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "mm": {"root": "النهي عن الغضب", "b": ["تذكر إنّ سطوة الغاضب، تعرّض الغاضب لسخط الله تعالى وعقابه، وربما عرّضته لسطوة من أغضبه واقتصاصه منه في نفسه أو في ماله أو في عزيز عليه."]}, "id": "g104", "k": 104}, {"ch": 6, "topic": "النهي عن الغضب", "q": "من علاج الغضب “ تذكر أنّ من الخير للغاضب ضبط النفس ” وضح ذلك؟", "alt": [], "a": "تذكّر أنّ من الخير للغاضب ضبط النفس، والسيطرة على الأعصاب والتروّي في أقواله وأفعاله عند احتدام الغضب، فذلك مما يخفّف حدّة التوتر والتهيج، ويعيده إلى الرشد والصواب، ولا يُنال ذلك إلاّ بالتصبر والتعوّد قال أمير المؤمنين (عليه السلام): “إن لم تكن حليماً فتحلّم، فإنه قلّ من تشبّه بقوم أوشك أن يكون منهم”.", "tbl": null, "yrs": "الجواب النموذجي", "pts": [], "kw": [], "m const $=s=>document.querySelector(s),app=$('#app');
let MEM={};const store={get(k,d){try{const v=localStorage.getItem('ph_'+k);return v?JSON.parse(v):d}catch(e){return k in MEM?MEM[k]:d}},set(k,v){try{localStorage.setItem('ph_'+k,JSON.stringify(v))}catch(e){MEM[k]=v}}};

function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b2350;border:1px solid var(--bd);padding:8px 16px;border-radius:14px;z-index:99;font-weight:700';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function speak(t){stopSpeak();try{t=String(t).replace(/ﷺ/g,'صلى الله عليه وآله').replace(/[﴿﴾()«»\[\]*#]/g,' ').replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/\s+/g,' ');const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));let sv=null;try{sv=localStorage.getItem('vn')}catch(e){}const v=vs.find(x=>x.name===sv)||vs.find(x=>/enhanced|premium|majed|maged|tarik|ماجد|طارق/i.test(x.name))||vs.find(x=>/SA/i.test(x.lang))||vs[0];if(!v)toast('جهازك ما عنده صوت عربي. نزّل صوتاً عربياً من إعدادات الجهاز');const ch=t.match(/[^.!؟:؛\n]{1,170}(?:[.!؟:؛\n]|$)/g)||[t];ch.forEach(c=>{if(!c.trim())return;const u=new SpeechSynthesisUtterance(c.trim());u.lang=v?v.lang:'ar-SA';if(v)u.voice=v;u.rate=.85;speechSynthesis.speak(u)})}catch(e){toast('الصوت غير مدعوم في هذا المتصفح')}}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
function daysLeft(){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.max(0,Math.round((new Date(2027,5,14)-t0)/864e5))}

 step()}
function askDream(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg"><div style="font-size:40px">✨</div><h3 style="margin:4px 0 10px">اكتب حلمك</h3><input id="di" maxlength="60" placeholder="مثال: أصير معلماً" value="${dream.replace(/"/g,'&quot;')}"><button class="btn" id="ds">حفظ</button><button class="btn g" id="dl">لاحقاً</button></div>`;document.body.appendChild(o);const f=()=>{o.remove();if(app.querySelector('.hero'))home()};
  $('#ds').onclick=()=>{dream=$('#di').value.trim();store.set('dream',dream);f()};$('#dl').onclick=()=>{o.remove()};setTimeout(()=>$('#di').focus(),50)}

/* ================== قائمة الأسئلة ================== */
function qList(list,back,showChap){
  let prevTopic='';
  return list.map((q,i)=>{
    const head=(showChap&&q.topic!==prevTopic)?`<div class="thd">${showChap===2?'الدرس '+ORD[q.ch-1]+' · ':''}${q.topic}</div>`:'';
    prevTopic=q.topic;
    return head+`<button class="qi" data-i="${i}"><span class="qn">${i+1}</span><span class="qtx">${q.q}</span><span class="qa">›</span></button>`;
  }).join('');
}
function bindList(list,back){app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>viewer(list,+b.dataset.i,back))}
function chapter(c){
  const ks=QS.filter(q=>q.ch===c);
  if(!ks.length)return toast('أسئلة هذا الدرس ستُضاف قريباً');
  page('الدرس '+ORD[c-1]+': '+CH[c-1][0],`<div class="card"><small>${ks.length} سؤال · اضغط على أي سؤال ليشرح لك بالتفصيل</small></div>${qList(ks,home,1)}
`,home);
  bindList(ks,()=>chapter(c));}
function allQ(){
  page('كل أسئلة الوحدة الأولى',`<div class="card"><small>${QS.length} سؤال من الدروس الستة · اضغط على أي سؤال</small></div>${qList(QS,home,2)}`,home);
  bindList(QS,allQ);
}

/* ================== العرض المتحرك للسؤال ================== */
let MMN=0;
function mmNode(x,leaf){const d=(MMN++*.6+.3).toFixed(2);if(typeof x==='string')return '<li style="animation-delay:'+d+'s"><span class="'+(leaf?'leaf':'mmn')+'">'+x+'</span></li>';const subs=x[1]||[];return '<li style="animation-delay:'+d+'s"><span class="mmn">'+x[0]+'</span>'+(subs.length?'<ul class="mmc">'+subs.map(s=>mmNode(s,true)).join('')+'</ul>':'')+'</li>'}
function mmHtml(q){const m=q.mm;if(!m)return '';MMN=0;return '<div class="mm"><div class="mmr">'+m.root+'</div><ul class="mmt">'+m.b.map(x=>mmNode(x,false)).join('')+'</ul></div>'}
function tblHtml(q){return '<div class="mm"><table class="t"><tr>'+q.tbl.h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+q.tbl.r.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>'}

function memoText(t,l){let n=0;return t.split(/(\s+)/).map(w=>{if(!w.trim())return w;const hide=l===3||(l===1?n%4===3:n%2===1);n++;if(!hide)return w;const o=w.replace(/"/g,'&quot;');return '<span class="hd" data-w="'+o+'">'+(l===3?w.charAt(0)+'…':'▢'.repeat(Math.min(4,Math.max(2,w.length>>1))))+'</span>'}).join('')}
function memoBind(q){let l=0;const b=$('#memb'),a=document.querySelector('.atxt');const N=['🧠 وضع الحفظ: عادي','🧠 مستوى 1: كلمة من كل 4 مخفية','🧠 مستوى 2: كلمة من كل 2 مخفية','🧠 مستوى 3: الحرف الأول فقط'];
 b.onclick=()=>{l=(l+1)%4;b.textContent=N[l];
  if(q.tbl){document.querySelectorAll('.t tr').forEach((r,ri)=>{if(!ri)return;[...r.children].forEach((c,ci)=>{if(c.dataset.o===undefined)c.dataset.o=c.innerHTML;const hide=l>0&&ci>=(l>=2?1:2);c.innerHTML=hide?'<span class="hd" data-w="'+c.dataset.o.replace(/"/g,'&quot;')+'">▢ ▢ ▢</span>':c.dataset.o})})}
  else{a.innerHTML=l?memoText(q.a,l):q.a}};
 $('#stg').addEventListener('click',e=>{const h=e.target.closest('.hd');if(h)h.outerHTML='<b style="color:#86efac">'+h.dataset.w+'</b>'})}
function viewer(list,i,back){
  stopSpeak();
  const q=list[i];const nb=(q.mm&&q.mm.b.length)||0;
  const ansDelay=(.5+nb*.6+.3).toFixed(2);
  show(`${frame('sm')}
  <div class="bar"><button class="bk" id="bk">▶ رجوع</button><b>${i+1} / ${list.length}</b></div>
  <div class="stage" id="stg">
    <img class="thinker sm" src="${THINKER}" alt="آرم">
    <span class="chip">الدرس ${ORD[q.ch-1]} · ${q.topic}</span>
    <div class="sq">${q.q}</div>${q.alt&&q.alt.length?'<div class="alts">'+q.alt.map(x=>'<div>↳ '+x+'</div>').join('')+'</div>':''}
    <div class="ans" style="animation-delay:${ansDelay}s">${q.tbl?tblHtml(q):mmHtml(q)}<div class="atxt">${q.a}</div></div>
  </div>
  <div class="ctl"><button class="btn g" id="rp">🔁 إعادة العرض</button><button class="btn g" id="sp">🔊 استمع</button></div>
  <div class="ctl"><button class="btn g" id="memb" style="width:100%">🧠 وضع الحفظ: عادي</button></div>
  <div class="ctl"><button class="btn g" id="vcb" style="width:100%">🎙 تغيير الصوت</button></div>
  <div class="row"><button class="btn g" id="pv" ${i===0?'disabled':''}>◀ السابق</button><button class="btn" id="nx" ${i>=list.length-1?'disabled':''}>التالي ▶</button></div>`);
  $('#bk').onclick=()=>{stopSpeak();back()};
  $('#rp').onclick=()=>viewer(list,i,back);
  $('#sp').onclick=()=>speak(plain(q.q)+'. الجواب: '+(q.tbl?q.tbl.r.map(r=>r[0]+': '+r[1]+'، '+r[2]).join('. '):plain(q.a)));
  memoBind(q);
  $('#vcb').onclick=()=>{const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));if(!vs.length){toast('ما لقيت صوت عربي بجهازك');return}let c=0;try{const n=localStorage.getItem('vn');c=Math.max(0,vs.findIndex(x=>x.name===n))}catch(e){}const nx=vs[(c+1)%vs.length];try{localStorage.setItem('vn',nx.name)}catch(e){}toast('الصوت: '+nx.name);speak('بسم الله الرحمن الرحيم')};
  $('#pv').onclick=()=>viewer(list,i-1,back);
  $('#nx').onclick=()=>viewer(list,i+1,back);
}

/* ================== المواد ================== */
function listCard(title,items){return '<div class="card"><b>'+title+'</b><ul class="n">'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'}
function lawsCard(c){const L=LAWS[c]||[];if(!L.length)return '';return '<div class="card"><b>الدرس '+ORD[c-1]+': '+CH[c-1][0]+'</b><table class="t" style="margin-top:8px">'+L.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table></div>'}
function lawsOf(c){page('النصوص المقررة - الدرس '+ORD[c-1],lawsCard(c)||'<div class="card">لا توجد نصوص لهذا الدرس بعد.</div>',()=>chapter(c))}
function notesOf(c){page('ملاحظات الدرس '+ORD[c-1],listCard('ملاحظات',NOTES[c]||[]),()=>chapter(c))}
function trapsOf(c){page('الخدع الوزارية - الدرس '+ORD[c-1],listCard('خدع وزارية',TRAPS[c]||[]),()=>chapter(c))}
function notes(){page('الملاحظات الوزارية',`<div class="card"><b>توزيع الدرجات (حسب الملخص الوزاري)</b><table class="t" style="margin-top:8px"><tr><th>الدرس</th><th>الدرجة</th></tr>${CH.map((c,i)=>`<tr><td>${ORD[i]} — ${c[0]}</td><td>${c[1]}</td></tr>`).join('')}</table></div><div class="card"><b>ملاحظات عامة</b><ul class="n">${GNOTES.map(x=>`<li>${x}</li>`).join('')}</ul></div>`)}
function laws(){page('النصوص المقررة',CH.map((c,i)=>lawsCard(i+1)).join(''))}
function consts(){page('المفاهيم والمعاني',`<div class="card"><b>معاني الكلمات الوزارية</b><table class="t" style="margin-top:8px"><tr><th>الكلمة</th><th>المعنى</th></tr>${CONSTS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`)}
function ask(){show(frame('sm')+'<div class="bar"><button class="bk" id="bk">▶ رجوع</button><b>اسألني</b></div><div class="card"><div class="qt" style="font-size:16px;margin-top:0">اكتب أي سؤال من التربية الإسلامية (حتى لو بصياغة مختلفة)، وأعرض لك أقرب الأسئلة مع الجواب النموذجي:</div><textarea id="aq" placeholder="مثال: ما حكم النون الساكنة قبل حرف الحاء؟"></textarea><button class="btn" id="ak">اسألني</button></div><div id="ar"></div>');
  $('#bk').onclick=home;
  $('#ak').onclick=()=>{const r=searchQ($('#aq').value);
   $('#ar').innerHTML=r.length?r.map((x,i)=>'<div class="card q"><span class="chip">الدرس '+ORD[x.q.ch-1]+'</span> <span class="yr">'+x.q.topic+'</span><div class="qt">'+x.q.q+'</div></div><div class="sol">'+x.q.a+'</div>').join(''):'<div class="fbk mid">ما لقيت سؤالاً قريباً. جرّب تكتب السؤال بكلمة مفتاحية من الدرس.</div>'}}
const SW_=new Set(['ما','من','على','في','الى','عن','هو','هي','ان','كيف','وضح','احسب','اذكر','علل','هل','ماذا','او','مع','بين','كل','التي','الذي','لي','اشرح','عرف','يبين','يوضح','لماذا','لم','اكتب','و','ب','ل','ف','عند','هذا','هذه','ي'].map(x=>x.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')));
const nzq=s=>(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[،؛.؟!:«»"'()\-]/g,' ').toLowerCase();
function stemW(w){w=w.replace(/^(وال|فال|بال|لل|ال)/,'');return w.slice(0,4)}
function toksOf(t){return [...new Set(nzq(String(t).replace(/<[^>]+>/g,' ')).split(/[\s\/=,:.؟?،;]+/).filter(w=>w.length>=2&&!SW_.has(w)).map(stemW))]}
let IDX=null;
function buildIdx(){if(IDX)return IDX;const N=QS.length;const docs=QS.map(q=>({q,set:new Set(toksOf(q.q+' '+q.topic+' '+(q.kw||[]).map(g=>g.join(' ')).join(' ')+' '+q.a)),qset:new Set(toksOf(q.q+' '+q.topic))}));const df={};docs.forEach(d=>d.set.forEach(w=>df[w]=(df[w]||0)+1));IDX={docs,df,N};return IDX}
function searchQ(text){const I=buildIdx();const qt=toksOf(text);if(!qt.length)return[];const sc=I.docs.map(d=>{let s=0;qt.forEach(w=>{if(d.set.has(w)){const idf=Math.log(1+I.N/(1+(I.df[w]||0)));s+=idf*(d.qset.has(w)?2:1)}});return{q:d.q,s}});sc.sort((a,b)=>b.s-a.s);return sc.filter(x=>x.s>0).slice(0,3)}

/* ================== جلسة الدراسة (مؤقت) ================== */
let sTimer={end:0,left:0,run:false,iv:null,min:25,done:0},sAC=null;
try{const v=JSON.parse(localStorage.getItem('stdy')||'null');if(v&&v.done!=null)sTimer.done=v.done}catch(e){}
function sUnlock(){try{const A=window.AudioContext||window.webkitAudioContext;if(A&&!sAC)sAC=new A();if(sAC&&sAC.state==='suspended')sAC.resume()}catch(e){}}
function sBeep(){try{if(!sAC)return;[0,0.5,1.0].forEach(t=>{const o=sAC.createOscillator(),g=sAC.createGain();o.type='sine';o.frequency.value=880;o.connect(g);g.connect(sAC.destination);const s=sAC.currentTime+t;g.gain.setValueAtTime(0.3,s);g.gain.exponentialRampToValueAtTime(0.001,s+0.4);o.start(s);o.stop(s+0.45)})}catch(e){}}
function sNotify(){try{if(navigator.vibrate)navigator.vibrate([400,200,400,200,400])}catch(e){}}
function sFmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function sShow(){return sTimer.run?Math.max(0,sTimer.end-Date.now()):(sTimer.left||sTimer.min*60000)}
function sTick(){if(!sTimer.run)return;const left=sTimer.end-Date.now();const el=document.getElementById('sclk');if(el)el.textContent=sFmt(Math.max(0,left));if(left<=0)sFinish()}
function sStart(){if(sTimer.run)return;sUnlock();if(sTimer.left<=0)sTimer.left=sTimer.min*60000;sTimer.end=Date.now()+sTimer.left;sTimer.run=true;clearInterval(sTimer.iv);sTimer.iv=setInterval(sTick,250);sTick()}
function sPause(){if(!sTimer.run)return;sTimer.left=Math.max(0,sTimer.end-Date.now());sTimer.run=false;clearInterval(sTimer.iv)}
function sReset(){sTimer.run=false;clearInterval(sTimer.iv);sTimer.left=sTimer.min*60000}
function sFinish(){sTimer.run=false;clearInterval(sTimer.iv);sTimer.left=0;sTimer.done++;try{localStorage.setItem('stdy',JSON.stringify({done:sTimer.done}))}catch(e){}sBeep();sNotify();if(document.getElementById('sclk'))studyScreen();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg"><div style="font-size:52px">⏰</div><h3 style="margin:4px 0 8px">انتهت الجلسة!</h3><p>أحسنت، استرح دقيقة واشرب مَي.</p><button class="btn" id="sok">تمام</button></div>`;document.body.appendChild(o);o.querySelector('#sok').onclick=()=>o.remove()}
function studyScreen(){const presets=[15,25,45,60,90,120,180,240,300,360];page('⏱ جلسة دراسة',`
<section class="card" style="text-align:center"><div id="sclk" style="font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px">${sFmt(sShow())}</div><small>${sTimer.run?'الجلسة شغالة... ركّز':'اختار المدة وابدأ'}</small><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="sgo">${sTimer.run?'⏸ وقّف':'▶ ابدأ'}</button><button class="btn g" id="srs">↺ إعادة</button></div></section>
<h3>المدة</h3><div class="two">${presets.map(m=>`<button class="ch" data-m="${m}" style="${sTimer.min===m?'outline:2px solid var(--c1,#22d3ee)':''}"><b>${m} دقيقة</b></button>`).join('')}</div>
<div class="row" style="margin-top:8px"><input id="smin" type="number" min="1" max="360" placeholder="مدة مخصصة بالدقائق" style="flex:1"><button class="btn g" id="sset">تطبيق</button></div>
<p style="font-size:14px">أنجزت <b>${sTimer.done}</b> ${sTimer.done===1?'جلسة':'جلسات'} حتى الآن.</p>`);
  $('#sgo').onclick=()=>{sTimer.run?sPause():sStart();studyScreen()};
  $('#srs').onclick=()=>{sReset();studyScreen()};
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sTimer.min=+b.dataset.m;sReset();studyScreen()});
  $('#sset').onclick=()=>{const v=Math.round(+$('#smin').value);if(v>=1&&v<=360){sTimer.min=v;sReset();studyScreen()}else toast('اكتب مدة من 1 إلى 360 دقيقة')}}

const st2=document.createElement('style');st2.textContent='.cdn{display:flex;gap:8px;justify-content:center;width:100%}.cdn div{flex:1;background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:8px 4px;text-align:center}.cdn b{display:block;font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;direction:ltr;line-height:1.3}.cdn span{font-size:13px;color:var(--mut)}'+

'.ctl{display:flex;gap:10px;margin:12px 0 0}.ctl .btn{margin:0}';
st2.textContent+='.mm{padding:4px 0 8px;overflow-x:auto}.mmr{display:block;width:fit-content;margin:0 auto 10px;background:linear-gradient(135deg,var(--gold),var(--pk));color:#1b1200;font-weight:800;padding:10px 18px;border-radius:999px;font-size:16px;box-shadow:0 8px 24px rgba(251,191,36,.25)}.mmt,.mmc{list-style:none;margin:0;padding:0}.mmt{padding-right:14px;border-right:2px solid rgba(251,191,36,.5);margin-right:12px}.mmc{padding-right:16px;border-right:2px dashed rgba(34,211,238,.5);margin:6px 0 0 6px}.mmt>li,.mmc>li{position:relative;margin:8px 0}.mmt>li::before,.mmc>li::before{content:"";position:absolute;right:-16px;top:50%;width:14px;height:2px;background:rgba(251,191,36,.5)}.mmc>li::before{background:rgba(34,211,238,.5)}.mmn{display:inline-block;background:rgba(124,92,255,.22);border:1px solid rgba(124,92,255,.6);padding:6px 12px;border-radius:12px;font-weight:700;line-height:1.6}.leaf{display:inline-block;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);padding:5px 10px;border-radius:10px;font-size:15px;line-height:1.6}.mm li{animation:ptIn .5s ease both}';

function cdHTML(){let ms=new Date(2027,5,14,8,0,0)-new Date();if(ms<0)ms=0;const s=Math.floor(ms/1000);const parts=[['يوم',Math.floor(s/86400)],['ساعة',Math.floor(s%86400/3600)],['دقيقة',Math.floor(s%3600/60)],['ثانية',s%60]];return parts.map(p=>'<div><b>'+String(p[1]).padStart(p[0]==='يوم'?1:2,'0')+'</b><span>'+p[0]+'</span></div>').join('')}
function ring(){return '<div class="cdn" id="cdn">'+cdHTML()+'</div>'}
setInterval(()=>{const el=document.getElementById('cdn');if(el)el.innerHTML=cdHTML()},1000);
home();if(!dream)setTimeout(askDream,400);
